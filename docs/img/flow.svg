<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="Helvetica, Arial, sans-serif"><rect width="1120" height="470" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><text x="30" y="40" font-size="26" font-weight="bold" fill="#111">From the film to the glasses</text><rect x="30" y="270" width="190" height="150" rx="14" fill="#e8f0fb" stroke="#1e5b8f" stroke-width="3"/><text x="125.0" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Media box</text><text x="125.0" y="326" font-size="14" text-anchor="middle" fill="#333">CoreELEC yacer build</text><text x="125.0" y="346" font-size="14" text-anchor="middle" fill="#333">+ add-on Shutter 3D</text><text x="125.0" y="366" font-size="14" text-anchor="middle" fill="#333">stamps every frame:</text><text x="125.0" y="386" font-size="14" text-anchor="middle" fill="#333">time and eye</text><rect x="330" y="270" width="190" height="150" rx="14" fill="#fff3e6" stroke="#a33f00" stroke-width="3"/><text x="425.0" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">The board</text><text x="425.0" y="326" font-size="14" text-anchor="middle" fill="#333">Pro Micro</text><text x="425.0" y="346" font-size="14" text-anchor="middle" fill="#333">+ this firmware</text><text x="425.0" y="366" font-size="14" text-anchor="middle" fill="#333">switches its pin at</text><text x="425.0" y="386" font-size="14" text-anchor="middle" fill="#333">each eye change</text><rect x="630" y="270" width="190" height="150" rx="14" fill="#eef7ee" stroke="#14532a" stroke-width="3"/><text x="725.0" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">3D emitter</text><text x="725.0" y="326" font-size="14" text-anchor="middle" fill="#333">an existing kit</text><text x="725.0" y="346" font-size="14" text-anchor="middle" fill="#333">IR or RF</text><text x="725.0" y="366" font-size="14" text-anchor="middle" fill="#333">(Hi-Shock, Optoma,</text><text x="725.0" y="386" font-size="14" text-anchor="middle" fill="#333">XPAND, Volfoni…)</text><rect x="910" y="270" width="180" height="150" rx="14" fill="#f3eefb" stroke="#5b3a8f" stroke-width="3"/><text x="1000.0" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Glasses</text><text x="1000.0" y="326" font-size="14" text-anchor="middle" fill="#333">the emitter's own</text><text x="1000.0" y="346" font-size="14" text-anchor="middle" fill="#333">shutter glasses</text><text x="1000.0" y="366" font-size="14" text-anchor="middle" fill="#333">left, right, left…</text><rect x="30" y="70" width="250" height="130" rx="14" fill="#f4f4f4" stroke="#666" stroke-width="3"/><text x="155.0" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">TV without 3D</text><text x="155.0" y="126" font-size="14" text-anchor="middle" fill="#333">1080p at 120 Hz, game mode</text><text x="155.0" y="146" font-size="14" text-anchor="middle" fill="#333">with VRR (HDMI 2.1)</text><text x="155.0" y="166" font-size="14" text-anchor="middle" fill="#333">shows left, right, left…</text><path d="M 125.0 270 L 125.0 204" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="137.0" y="243" font-size="14" font-weight="bold" fill="#444">HDMI</text><path d="M 220 345 L 326 345" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="273.0" y="333" font-size="14" font-weight="bold" text-anchor="middle" fill="#444">USB</text><text x="273.0" y="369" font-size="12" text-anchor="middle" fill="#666">frame, time, eye</text><path d="M 520 345 L 626 345" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="573.0" y="333" font-size="14" font-weight="bold" text-anchor="middle" fill="#444">VESA stereo</text><text x="573.0" y="369" font-size="12" text-anchor="middle" fill="#666">high = left eye</text><path d="M 820 345 L 906 345" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="863.0" y="333" font-size="14" font-weight="bold" text-anchor="middle" fill="#444">IR or radio</text><path d="M 1000 266 Q 1000 135 286 135" stroke="#5b3a8f" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/><text x="620" y="125" font-size="14" fill="#5b3a8f">you watch the TV through the glasses: each lens opens for its eye</text><text x="30" y="455" font-size="14" fill="#444">The board replaces the 3D sync output of a 3D projector: the emitter and its glasses work as they would there.</text></svg>