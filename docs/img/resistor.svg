<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif"><rect width="800" height="500" fill="#ffffff"/><text x="30" y="40" font-size="26" font-weight="bold" fill="#111">The resistor, in the sync wire</text><text x="30" y="125" font-size="16" fill="#333">One 220 Ω:</text><path d="M 140 120 L 240 120" stroke="#a33f00" stroke-width="5"/><rect x="240" y="104" width="110" height="32" rx="8" fill="#d9c7a3" stroke="#6b5532" stroke-width="2"/><rect x="256" y="104" width="9" height="32" fill="#c0392b"/><rect x="276" y="104" width="9" height="32" fill="#c0392b"/><rect x="296" y="104" width="9" height="32" fill="#7b4a1e"/><rect x="316" y="104" width="9" height="32" fill="#c9a227"/><text x="295" y="94" font-size="14" text-anchor="middle" fill="#6b5532">red red brown</text><path d="M 350 120 L 520 120" stroke="#a33f00" stroke-width="5"/><text x="140" y="150" font-size="13" fill="#555">from pin 9</text><text x="520" y="150" font-size="13" text-anchor="end" fill="#555">to SYNC</text><text x="30" y="265" font-size="16" fill="#333">Two 100 Ω:</text><path d="M 140 260 L 190 260" stroke="#a33f00" stroke-width="5"/><rect x="190" y="244" width="110" height="32" rx="8" fill="#d9c7a3" stroke="#6b5532" stroke-width="2"/><rect x="206" y="244" width="9" height="32" fill="#7b4a1e"/><rect x="226" y="244" width="9" height="32" fill="#111111"/><rect x="246" y="244" width="9" height="32" fill="#7b4a1e"/><rect x="266" y="244" width="9" height="32" fill="#c9a227"/><text x="245" y="234" font-size="14" text-anchor="middle" fill="#6b5532">brown black brown</text><path d="M 300 260 L 360 260" stroke="#8a8f96" stroke-width="5"/><circle cx="330" cy="260" r="9" fill="#9ea3a8" stroke="#5d6166" stroke-width="2"/><rect x="360" y="244" width="110" height="32" rx="8" fill="#d9c7a3" stroke="#6b5532" stroke-width="2"/><rect x="376" y="244" width="9" height="32" fill="#7b4a1e"/><rect x="396" y="244" width="9" height="32" fill="#111111"/><rect x="416" y="244" width="9" height="32" fill="#7b4a1e"/><rect x="436" y="244" width="9" height="32" fill="#c9a227"/><text x="415" y="234" font-size="14" text-anchor="middle" fill="#6b5532">brown black brown</text><path d="M 470 260 L 560 260" stroke="#a33f00" stroke-width="5"/><text x="330" y="300" font-size="13" text-anchor="middle" fill="#555">solder the two ends together</text><text x="140" y="290" font-size="13" fill="#555">from pin 9</text><text x="560" y="290" font-size="13" text-anchor="end" fill="#555">to SYNC</text><text x="30" y="405" font-size="16" fill="#333">Then cover it:</text><path d="M 160 400 L 600 400" stroke="#a33f00" stroke-width="5"/><rect x="210" y="376" width="340" height="48" rx="20" fill="#222" fill-opacity="0.85"/><text x="380" y="406" font-size="15" text-anchor="middle" fill="#fff">heat-shrink tube (or tape)</text><text x="30" y="460" font-size="14" fill="#444">Slide the tube onto the wire before soldering, push it over the resistor afterwards and heat it</text><text x="30" y="480" font-size="14" fill="#444">(a hair dryer on hot does it). No bare metal may touch the ground wire.</text></svg>