<text x="908" y="254" font-size="12" fill="#555">powers the emitter</text></g><text x="30" y="672" font-size="14" fill="#444">Any GND pin works (they are joined). The green wire also goes to the plug's metal shell. Only the orange wire has a resistor.</text>
<text x="30" y="694" font-size="14" fill="#444">The red wire powers the emitter through the 3-pin cable. (3.5 mm cable, untested: no +5 V, leave VCC free, use its USB plug.)</text>
