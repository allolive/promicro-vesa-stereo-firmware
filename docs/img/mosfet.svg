<text x="64" y="486" font-size="17" font-weight="bold" fill="#c0392b">+5 V</text>
<text x="64" y="504" font-size="13" fill="#333">other side pin</text>
<text x="30" y="738" font-size="14" fill="#444">Pin 8 low: the emitter is on. Pin 8 high, or not driven yet: off (the 10 kΩ pulls the gate up to VCC).</text>
<text x="30" y="760" font-size="14" fill="#444">Source to VCC, drain to the emitter: the other way round, the MOSFET's inner diode feeds the emitter even when off.</text>
