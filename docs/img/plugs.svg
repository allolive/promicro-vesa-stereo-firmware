<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" font-family="Helvetica, Arial, sans-serif"><rect width="980" height="650" fill="#ffffff"/><text x="30" y="40" font-size="26" font-weight="bold" fill="#111">Which pin is which: the 3-pin VESA plug</text><text x="30" y="66" font-size="15" fill="#444">Three pins around a plastic block. Sync is the one next to the notch; ground and +5 V are on the two sides.</text><text x="230" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">The cable's plug, seen from its pins</text><text x="230" y="150" font-size="13" text-anchor="middle" fill="#555">(also: the back of a socket, where you solder)</text><circle cx="230" cy="250" r="78" fill="#c8ccd1" stroke="#7d838a" stroke-width="4"/><circle cx="230" cy="250" r="64" fill="#2b2b2b"/><text x="214" y="168" font-size="12" text-anchor="end" fill="#555">notch</text><rect x="220" y="164" width="20" height="24" rx="4" fill="#ffffff" stroke="#7d838a" stroke-width="2"/><rect x="221" y="232" width="18" height="48" rx="2" fill="#efe9d8" stroke="#9a937f" stroke-width="2"/><path d="M 230 282 L 230 345" stroke="#777" stroke-width="2"/><text x="230" y="360" font-size="13" text-anchor="middle" fill="#555">plastic pin (no metal)</text><circle cx="230" cy="210" r="10" fill="#e0c25a" stroke="#a33f00" stroke-width="4"/><path d="M 240 210 L 335 180" stroke="#a33f00" stroke-width="2.5"/><text x="340" y="184" font-size="16" font-weight="bold" fill="#a33f00">SYNC</text><circle cx="190" cy="256" r="10" fill="#e0c25a" stroke="#c0392b" stroke-width="4"/><path d="M 180 256 L 120 306" stroke="#c0392b" stroke-width="2.5"/><text x="116" y="324" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">+5 V</text><circle cx="270" cy="256" r="10" fill="#e0c25a" stroke="#14532a" stroke-width="4"/><path d="M 280 256 L 340 306" stroke="#14532a" stroke-width="2.5"/><text x="344" y="324" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532a">GROUND</text><text x="700" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">A socket, seen from the front</text><text x="700" y="150" font-size="13" text-anchor="middle" fill="#555">(where the plug goes in)</text><circle cx="700" cy="250" r="78" fill="#c8ccd1" stroke="#7d838a" stroke-width="4"/><circle cx="700" cy="250" r="64" fill="#2b2b2b"/><text x="684" y="168" font-size="12" text-anchor="end" fill="#555">notch</text><rect x="690" y="164" width="20" height="24" rx="4" fill="#ffffff" stroke="#7d838a" stroke-width="2"/><rect x="691" y="232" width="18" height="48" rx="2" fill="#efe9d8" stroke="#9a937f" stroke-width="2"/><circle cx="700" cy="210" r="10" fill="#e0c25a" stroke="#a33f00" stroke-width="4"/><path d="M 710 210 L 805 180" stroke="#a33f00" stroke-width="2.5"/><text x="810" y="184" font-size="16" font-weight="bold" fill="#a33f00">SYNC</text><circle cx="660" cy="256" r="10" fill="#e0c25a" stroke="#14532a" stroke-width="4"/><path d="M 650 256 L 590 306" stroke="#14532a" stroke-width="2.5"/><text x="586" y="324" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532a">GROUND</text><circle cx="740" cy="256" r="10" fill="#e0c25a" stroke="#c0392b" stroke-width="4"/><path d="M 750 256 L 810 306" stroke="#c0392b" stroke-width="2.5"/><text x="814" y="324" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">+5 V</text><text x="465" y="258" font-size="30" text-anchor="middle" fill="#888">⇄</text><text x="465" y="282" font-size="12" text-anchor="middle" fill="#888">mirror</text><text x="30" y="400" font-size="14" font-weight="bold" fill="#111">Ground swaps sides between the two views. Before soldering, confirm it with the multimeter on beep:</text><text x="30" y="422" font-size="14" font-weight="normal" fill="#333">ground beeps against the metal shell of the cable's other end (the mini-USB plug into the emitter). The plug's own shell gets the GND wire too.</text><text x="30" y="444" font-size="14" font-weight="normal" fill="#333">If the other side pin beeps instead, your cable is the mirror image: go by the multimeter, not the drawing.</text><text x="30" y="466" font-size="14" font-weight="normal" fill="#777">Pin numbers are not shown on purpose: published pinouts number these pins differently.</text><text x="30" y="530" font-size="17" font-weight="bold" fill="#333">3.5 mm mono plug (Sony cable, untested)</text><rect x="40" y="568" width="110" height="44" rx="8" fill="#2b2b2b"/><rect x="150" y="579" width="150" height="22" fill="#c8ccd1" stroke="#7d838a" stroke-width="2"/><rect x="300" y="579" width="11" height="22" fill="#111"/><path d="M 311 579 L 345 579 Q 368 590 345 601 L 311 601 Z" fill="#e0c25a" stroke="#8a6d1e" stroke-width="2"/><path d="M 352 590 L 400 570" stroke="#a33f00" stroke-width="2.5"/><text x="405" y="574" font-size="15" font-weight="bold" fill="#a33f00">tip = SYNC</text><path d="M 225 601 L 255 626" stroke="#14532a" stroke-width="2.5"/><text x="260" y="634" font-size="15" font-weight="bold" fill="#14532a">sleeve = GROUND</text><text x="560" y="594" font-size="13" fill="#555">no +5 V: the cable's USB plug powers the emitter</text></svg>