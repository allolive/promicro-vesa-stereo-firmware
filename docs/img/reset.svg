<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="665" fill="#ffffff"/><text x="30" y="40" font-size="26" font-weight="bold" fill="#111">If flashing does not start: the double reset</text><text x="30" y="66" font-size="15" fill="#444">Pro Micro seen from the top, USB socket up. RST is the third pin of the right-hand row.</text><rect x="300" y="110" width="260" height="470" rx="14" fill="#1e5b8f" stroke="#0f3555" stroke-width="3"/><rect x="392" y="80" width="76" height="44" rx="6" fill="#b9bec4" stroke="#6b7177" stroke-width="2"/><rect x="400" y="320" width="60" height="110" fill="#111" rx="4"/><text x="430" y="380" font-size="11" text-anchor="middle" fill="#ddd" transform="rotate(-90 430 376)">ATmega32U4</text><circle cx="326" cy="160" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="165" font-size="15" fill="#fff">TX</text><circle cx="534" cy="160" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="165" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">RAW</text><circle cx="326" cy="194" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="199" font-size="15" fill="#fff">RX</text><circle cx="534" cy="194" r="9" fill="#ff7a1a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="199" font-size="15" fill="#fff" text-anchor="end" font-weight="bold">GND</text><circle cx="326" cy="228" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="233" font-size="15" fill="#fff">GND</text><circle cx="534" cy="228" r="9" fill="#ff7a1a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="233" font-size="15" fill="#fff" text-anchor="end" font-weight="bold">RST</text><circle cx="326" cy="262" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="267" font-size="15" fill="#fff">GND</text><circle cx="534" cy="262" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="267" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">VCC</text><circle cx="326" cy="296" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="301" font-size="15" fill="#fff">2</text><circle cx="534" cy="296" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="301" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">A3</text><circle cx="326" cy="330" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="335" font-size="15" fill="#fff">3</text><circle cx="534" cy="330" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="335" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">A2</text><circle cx="326" cy="364" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="369" font-size="15" fill="#fff">4</text><circle cx="534" cy="364" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="369" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">A1</text><circle cx="326" cy="398" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="403" font-size="15" fill="#fff">5</text><circle cx="534" cy="398" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="403" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">A0</text><circle cx="326" cy="432" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="437" font-size="15" fill="#fff">6</text><circle cx="534" cy="432" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="437" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">15</text><circle cx="326" cy="466" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="471" font-size="15" fill="#fff">7</text><circle cx="534" cy="466" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="471" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">14</text><circle cx="326" cy="500" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="505" font-size="15" fill="#fff">8</text><circle cx="534" cy="500" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="505" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">16</text><circle cx="326" cy="534" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="344" y="539" font-size="15" fill="#fff">9</text><circle cx="534" cy="534" r="9" fill="#e8c76a" stroke="#8a6d1e" stroke-width="3"/><text x="516" y="539" font-size="15" fill="#fff" text-anchor="end" font-weight="normal">10</text><path d="M 700 140 L 540 194" stroke="#555" stroke-width="7" stroke-linecap="round"/><path d="M 700 280 L 540 228" stroke="#555" stroke-width="7" stroke-linecap="round"/><path d="M 700 140 Q 760 210 700 280" stroke="#555" stroke-width="7" fill="none"/><text x="770" y="205" font-size="15" fill="#333">tweezers</text><text x="770" y="225" font-size="15" fill="#333">or a wire</text><text x="30" y="620" font-size="16" fill="#333">Touch RST to the GND just above it, twice within half a second. The board then waits 8 seconds</text><text x="30" y="642" font-size="16" fill="#333">for new firmware. Start the upload within those 8 seconds.</text></svg>